services:
  picker:
    build:
      context: ../..
      dockerfile: deploy/product-picker/Dockerfile
    image: kwatt-email-product-picker:local
    container_name: kwatt-email-product-picker
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - picker-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 150s
volumes:
  picker-data:
