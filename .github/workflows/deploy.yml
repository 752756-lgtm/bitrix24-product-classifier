name: Deploy call summarizer

on:
  workflow_dispatch:
    inputs:
      deal_id:
        description: "ID сделки для обязательной проверки без записи"
        required: true

permissions:
  contents: read

concurrency:
  group: bitrix24-call-summarizer-production
  cancel-in-progress: false

jobs:
  hosted-backfill-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require completed hosted backfill
        shell: bash
        run: |
          set -Eeuo pipefail
          fingerprint="$({
            sha256sum classifier/precision_worker.py
            sha256sum classifier/precision_plan.py
            sha256sum classifier/bitrix.py
            sha256sum classifier/http.py
            sha256sum classifier/data/precision-2025.allowlist
            sha256sum classifier/data/precision-2025-taxonomy.json
          } | sha256sum | cut -d' ' -f1)"
          marker="precision-2025-complete-${fingerprint}"
          if ! git ls-remote --exit-code --refs --tags origin "refs/tags/${marker}" >/dev/null; then
            echo "::error::Hosted 2025 backfill is still active; refusing to queue production deployment"
            exit 1
          fi

  test-and-deploy:
    needs: hosted-backfill-gate
    runs-on: [self-hosted, linux, x64, production]
    timeout-minutes: 40
    env:
      BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
      DEAL_ID: ${{ inputs.deal_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Revalidate deployment ownership
        shell: bash
        run: |
          set -Eeuo pipefail
          latest_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "${latest_main}" != "${GITHUB_SHA}" ]; then
            echo "::error::A newer main commit exists; refusing to deploy a stale image"
            exit 1
          fi
          fingerprint="$({
            sha256sum classifier/precision_worker.py
            sha256sum classifier/precision_plan.py
            sha256sum classifier/bitrix.py
            sha256sum classifier/http.py
            sha256sum classifier/data/precision-2025.allowlist
            sha256sum classifier/data/precision-2025-taxonomy.json
          } | sha256sum | cut -d' ' -f1)"
          marker="precision-2025-complete-${fingerprint}"
          if ! git ls-remote --exit-code --refs --tags origin "refs/tags/${marker}" >/dev/null; then
            echo "::error::Hosted 2025 backfill is still active; refusing to deploy"
            exit 1
          fi

      - name: Validate required secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=0
          for name in BITRIX_WEBHOOK_URL OPENAI_API_KEY WEBHOOK_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Secret ${name} is not configured"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Prepare runtime configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          {
            printf 'BITRIX_WEBHOOK_URL=%s\n' "${BITRIX_WEBHOOK_URL}"
            printf 'OPENAI_API_KEY=%s\n' "${OPENAI_API_KEY}"
            printf 'OPENAI_MODEL=%s\n' 'gpt-5.6-luna'
            printf 'YML_URL=%s\n' 'https://100kwatt.ru/ab__pfe_34_testtt.yml'
            printf 'CATEGORY_FIELD_NAME=%s\n' 'Категория товаров (Сайт)'
            printf 'SUBCATEGORY_FIELD_NAME=%s\n' 'Подкатегория товаров (Сайт)'
            printf 'CATEGORY_FIELD_ID=%s\n' 'UF_CRM_1776320088319'
            printf 'SUBCATEGORY_FIELD_ID=%s\n' 'UF_CRM_1568228872884'
            printf 'WEBHOOK_SECRET=%s\n' "${WEBHOOK_SECRET}"
            printf 'HTTP_TIMEOUT=%s\n' '45'
            printf 'TITLE_MAX_LENGTH=%s\n' '100'
          } > "${RUNNER_TEMP}/runtime.env"

      - name: Build image
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build --pull -t "bitrix24-call-summarizer:${GITHUB_SHA}" .

      - name: Run tests
        shell: bash
        run: |
          set -Eeuo pipefail
          image="bitrix24-call-summarizer:${GITHUB_SHA}"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/tests:/app/tests:ro" \
            "${image}" python -m unittest discover -s tests -v
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/tests:/app/tests:ro" \
            "${image}" python -m compileall -q classifier tests

      - name: Dry-run deal and deploy web service
        shell: bash
        run: |
          set -Eeuo pipefail
          app_dir="${HOME}/.local/share/bitrix24-call-summarizer"
          container="bitrix24-call-summarizer"
          backup="${container}-previous"
          image="bitrix24-call-summarizer:${GITHUB_SHA}"
          release_marker="${app_dir}/web-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.done"
          transition_marker="${app_dir}/web-transition.active"
          generation_file="${app_dir}/web-release-generation"
          generation="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"

          install -d -m 700 "${app_dir}"
          install -m 600 "${RUNNER_TEMP}/runtime.env" "${app_dir}/.env"

          if ! docker run --rm --env-file "${app_dir}/.env" "${image}" \
            python -m classifier.backfill --deal-id "${DEAL_ID}" \
            >"${RUNNER_TEMP}/backfill-dry-run.log" 2>&1; then
            echo "::error::Mandatory read-only dry-run failed; details remain private on the runner"
            false
          fi
          echo "Mandatory read-only dry-run succeeded"

          # The hosted workflow is the sole category writer. Remove only worker
          # containers; persistent SQLite data remains under precision-data.
          for worker in \
            bitrix24-category-backfill-2025 \
            bitrix24-category-backfill-2025-next \
            bitrix24-category-backfill-2025-previous; do
            docker update --restart=no "${worker}" >/dev/null 2>&1 || true
            docker stop --time 30 "${worker}" >/dev/null 2>&1 || true
            docker rm "${worker}" >/dev/null 2>&1 || true
          done

          # A shared transition plus a generation token makes every detached
          # guard from an older run harmless before this run mutates Docker.
          rm -f "${release_marker}"
          touch "${transition_marker}"
          generation_tmp="${generation_file}.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "${generation}" > "${generation_tmp}"
          chmod 600 "${generation_tmp}"
          mv -f "${generation_tmp}" "${generation_file}"

          guard_env=(env -i "PATH=${PATH}" "HOME=${HOME}" "RUNNER_TRACKING_ID=web-release-guard")
          [ -z "${DOCKER_HOST:-}" ] || guard_env+=("DOCKER_HOST=${DOCKER_HOST}")
          [ -z "${XDG_RUNTIME_DIR:-}" ] || guard_env+=("XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}")
          "${guard_env[@]}" nohup bash -c '
            marker="$1"
            web="$2"
            backup="$3"
            transition="$4"
            generation_file="$5"
            generation="$6"
            current_generation() {
              [ -f "${generation_file}" ] && [ "$(<"${generation_file}")" = "${generation}" ]
            }
            healthy() {
              [ "$(docker inspect -f "{{.State.Running}}" "$1" 2>/dev/null || true)" = "true" ] && \
                docker exec "$1" python -c \
                  "import json,urllib.request; assert json.load(urllib.request.urlopen(\"http://127.0.0.1:8080/health\", timeout=3)).get(\"status\")==\"ok\"" \
                  >/dev/null 2>&1
            }
            restore() {
              current_generation || return 2
              [ -f "${marker}" ] && return 0
              if docker inspect "${backup}" >/dev/null 2>&1; then
                if docker inspect "${web}" >/dev/null 2>&1; then
                  docker rm -f "${web}" >/dev/null 2>&1 || return 1
                fi
                docker rename "${backup}" "${web}" >/dev/null 2>&1 || return 1
              fi
              docker inspect "${web}" >/dev/null 2>&1 || return 1
              docker start "${web}" >/dev/null 2>&1 || true
              for _ in $(seq 1 12); do
                current_generation || return 2
                if healthy "${web}"; then
                  touch "${marker}"
                  rm -f "${transition}"
                  return 0
                fi
                sleep 5
              done
              return 1
            }
            transition_wait=0
            for _ in $(seq 1 90); do
              current_generation || exit 0
              [ -f "${marker}" ] && exit 0
              if [ -f "${transition}" ] && [ "${transition_wait}" -lt 36 ]; then
                transition_wait="$((transition_wait + 1))"
                sleep 5
                continue
              fi
              if [ -f "${transition}" ]; then
                if restore; then
                  exit 0
                fi
                sleep 10
                continue
              fi
              if ! healthy "${web}"; then
                if restore; then
                  exit 0
                fi
              fi
              sleep 10
            done
          ' _ "${release_marker}" "${container}" "${backup}" "${transition_marker}" \
            "${generation_file}" "${generation}" \
            >"${app_dir}/web-release-guard.log" 2>&1 </dev/null &
          guard_pid=$!
          sleep 1
          if ! kill -0 "${guard_pid}" >/dev/null 2>&1; then
            echo "Web release recovery guard failed to start"
            false
          fi

          web_healthy() {
            [ "$(docker inspect -f '{{.State.Running}}' "${container}" 2>/dev/null || true)" = "true" ] && \
              docker exec "${container}" python -c \
                "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)).get('status')=='ok'" \
                >/dev/null 2>&1
          }

          web_replaced=0
          rollback_release() {
            rc=$?
            trap - ERR INT TERM
            set +e
            if [ "${web_replaced}" -eq 1 ]; then
              if docker inspect "${backup}" >/dev/null 2>&1; then
                docker rm -f "${container}" >/dev/null 2>&1 || true
                docker rename "${backup}" "${container}" >/dev/null 2>&1 || true
                docker start "${container}" >/dev/null 2>&1 || true
              elif docker inspect "${container}" >/dev/null 2>&1; then
                docker start "${container}" >/dev/null 2>&1 || true
              fi
            elif docker inspect "${container}" >/dev/null 2>&1; then
              docker start "${container}" >/dev/null 2>&1 || true
            elif docker inspect "${backup}" >/dev/null 2>&1; then
              docker rename "${backup}" "${container}" >/dev/null 2>&1 || true
              docker start "${container}" >/dev/null 2>&1 || true
            fi
            recovered=0
            for _ in $(seq 1 12); do
              if web_healthy; then
                recovered=1
                break
              fi
              sleep 5
            done
            if [ "${recovered}" -eq 1 ]; then
              touch "${release_marker}"
            fi
            # Without a verified marker the generation-aware detached guard
            # keeps retrying recovery immediately after the transition clears.
            rm -f "${transition_marker}"
            exit "${rc}"
          }
          trap rollback_release ERR INT TERM

          # Recovery of a previous interrupted release happens only after the
          # new guard and rollback trap are active, so every mutation is covered.
          canonical_running="$(docker inspect -f '{{.State.Running}}' "${container}" 2>/dev/null || true)"
          if [ "${canonical_running}" != "true" ]; then
            if docker inspect "${backup}" >/dev/null 2>&1; then
              if docker inspect "${container}" >/dev/null 2>&1; then
                docker rm -f "${container}" >/dev/null
              fi
              docker rename "${backup}" "${container}"
              docker start "${container}" >/dev/null
            elif docker inspect "${container}" >/dev/null 2>&1; then
              docker start "${container}" >/dev/null
            fi
          fi

          touch "${transition_marker}"
          if docker inspect "${backup}" >/dev/null 2>&1; then
            docker rm -f "${backup}" >/dev/null
          fi
          # Set before the first stop: rollback then covers cancellation both
          # before and after the canonical container is renamed to backup.
          web_replaced=1
          if docker inspect "${container}" >/dev/null 2>&1; then
            docker stop --time 30 "${container}"
            docker rename "${container}" "${backup}"
          fi
          docker run -d \
            --name "${container}" \
            --restart unless-stopped \
            --env-file "${app_dir}/.env" \
            -p 127.0.0.1:8080:8080 \
            "${image}"

          healthy=0
          for _ in $(seq 1 20); do
            if docker exec "${container}" python -c \
              "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3))['status']=='ok'" \
              >/dev/null 2>&1; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "${healthy}" -ne 1 ]; then
            docker logs "${container}" >"${RUNNER_TEMP}/web-startup.log" 2>&1 || true
            echo "Web health check failed; startup details remain private on the runner"
            false
          fi

          touch "${release_marker}"
          rm -f "${transition_marker}"
          docker rm -f "${backup}" >/dev/null 2>&1 || true
          trap - ERR INT TERM
          echo "Web service deployed; category writes remain owned by hosted backfill"

      - name: Remove temporary secret file
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/runtime.env"
